spring:
  datasource:
    url: jdbc:h2:mem:cards;DB_CLOSE_ON_EXIT=FALSE
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mongodb:
    database: expenses
  data:
    mongodb:
      auto-index-creation: true
      representation:
        big-decimal: decimal128
  web:
    locale: en
    locale-resolver: fixed
expenses:
  time-zone: America/Sao_Paulo
